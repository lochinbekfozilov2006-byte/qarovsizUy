name: Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: O'yin fayllarini yig'ish
        run: |
          mkdir -p /tmp/www
          find . -maxdepth 1 -type f \( -name '*.html' -o -name '*.js' -o -name '*.json' -o -name '*.glb' -o -name '*.mp3' -o -name '*.png' \) -exec cp {} /tmp/www/ \;
          rm -f /tmp/www/sw.js

      - name: Android loyihasini yaratish (Capacitor)
        run: |
          mkdir -p /tmp/app && cd /tmp/app
          mv /tmp/www ./www
          npm init -y > /dev/null
          npm i @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6 @capacitor-community/admob@6
          npx cap init "Qarovsiz Uy" uz.qarovsiz.uy --web-dir www
          npx cap add android
          npx cap sync android
          # ikonka
          RES=android/app/src/main/res
          rm -rf $RES/mipmap-anydpi-v26
          for d in $RES/mipmap-*; do cp www/icon-192.png $d/ic_launcher.png; cp www/icon-192.png $d/ic_launcher_round.png; done
          # ekran gorizontal, to'liq ekran
          sed -i 's/android:launchMode="singleTask"/android:launchMode="singleTask" android:screenOrientation="sensorLandscape"/' android/app/src/main/AndroidManifest.xml
          # AdMob (Google'ning sinov ilova ID'si — Play Market'dan oldin o'zingiznikiga almashtiriladi)
          sed -i 's#</application>#<meta-data android:name="com.google.android.gms.ads.APPLICATION_ID" android:value="ca-app-pub-3940256099942544~3347511713"/></application>#' android/app/src/main/AndroidManifest.xml
          grep -c APPLICATION_ID android/app/src/main/AndroidManifest.xml
          npx cap sync android

      - name: APK yasash
        run: |
          cd /tmp/app/android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk $GITHUB_WORKSPACE/qarovsiz-uy.apk

      - uses: actions/upload-artifact@v4
        with:
          name: qarovsiz-uy-apk
          path: qarovsiz-uy.apk
